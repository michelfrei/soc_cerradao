# PostgreSQL (soc.publication) -> Elasticsearch
#
# Leitura incremental por txid: só transações já encerradas (txid abaixo do
# xmin do snapshot) são lidas, então nenhuma linha confirmada fora de ordem é
# pulada. Não habilite paginação (jdbc_paging_enabled): todas as linhas de uma
# transação precisam vir na mesma consulta. Detalhes em docs/DECISOES.md.

input {
  jdbc {
    id => "soc_publication"
    jdbc_driver_library => "/usr/share/logstash/jdbc/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://${SOC_PG_HOST}:${SOC_PG_PORT}/soc?sslmode=${SOC_PG_SSLMODE}&ApplicationName=soc-logstash"
    jdbc_user => "${SOC_LOGSTASH_DB_USER}"
    jdbc_password => "${SOC_LOGSTASH_DB_PASSWORD}"
    jdbc_fetch_size => 1000
    schedule => "*/30 * * * * *"
    statement_filepath => "/usr/share/logstash/sql/publication.sql"
    use_column_value => true
    tracking_column => "txid"
    tracking_column_type => "numeric"
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/soc_publication_last_run.yml"
  }
}

filter {
  json {
    source => "payload_json"
    target => "defender"
    remove_field => ["payload_json"]
  }

  date {
    match => ["occurred_at_iso", "ISO8601"]
    timezone => "UTC"
  }

  mutate {
    add_field => {
      "[soc][entity]" => "%{entity}"
      "[soc][dataset]" => "%{dataset}"
      "[@metadata][doc_id]" => "%{doc_id}"
    }
    copy => {
      "id" => "[soc][publication_id]"
      "txid" => "[soc][txid]"
    }
  }
  mutate {
    remove_field => ["entity", "dataset", "doc_id", "id", "txid", "occurred_at_iso", "@version"]
  }

  if [soc][entity] == "event" {
    # Campos ECS a partir das colunas do Advanced Hunting. O registro original
    # fica inteiro em "defender".
    ruby {
      code => '
        map = {
          "DeviceName" => "[host][name]",
          "DeviceId" => "[host][id]",
          "ActionType" => "[event][action]",
          "AccountName" => "[user][name]",
          "AccountDomain" => "[user][domain]",
          "AccountSid" => "[user][id]",
          "RemoteIP" => "[source][ip]",
          "RemoteDeviceName" => "[source][domain]",
          "RemotePort" => "[source][port]",
          "LogonType" => "[winlog][logon][type]",
          "LogonId" => "[winlog][logon][id]",
          "Protocol" => "[soc][logon][protocol]",
          "FailureReason" => "[event][reason]",
          "FileName" => "[file][name]",
          "FolderPath" => "[file][path]",
          "SHA256" => "[file][hash][sha256]",
          "InitiatingProcessFileName" => "[process][name]",
          "InitiatingProcessCommandLine" => "[process][command_line]",
          "InitiatingProcessId" => "[process][pid]",
          "InitiatingProcessAccountName" => "[process][user][name]",
          "InitiatingProcessParentFileName" => "[process][parent][name]"
        }
        # RemoteIP/RemotePort/RemoteDeviceName: em logon são a origem da conexão;
        # nas demais tabelas (DeviceEvents, DeviceNetworkEvents) são o destino.
        unless event.get("[soc][dataset]") == "devicelogonevents"
          map["RemoteIP"] = "[destination][ip]"
          map["RemoteDeviceName"] = "[destination][domain]"
          map["RemotePort"] = "[destination][port]"
        end
        map.each do |src, dst|
          v = event.get("[defender][#{src}]")
          event.set(dst, v) unless v.nil? || v == ""
        end
        case event.get("[defender][ActionType]")
        when "LogonSuccess" then event.set("[event][outcome]", "success")
        when "LogonFailed" then event.set("[event][outcome]", "failure")
        end
      '
    }
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][module]" => "defender"
        "[event][dataset]" => "defender.%{[soc][dataset]}"
        "[@metadata][index]" => "soc-events-%{[soc][dataset]}-%{+YYYY.MM}"
      }
    }
  } else if [soc][entity] in ["incident", "alert", "incident_version", "alert_version"] {
    ruby {
      code => '
        require "time"
        d = event.get("defender") || {}
        event.set("[soc][object][id]", d["id"])
        event.set("[soc][object][title]", d["displayName"] || d["title"])
        %w[status severity classification determination].each { |k| event.set("[soc][object][#{k}]", d[k]) unless d[k].nil? }
        event.set("[soc][object][assigned_to]", d["assignedTo"]) unless d["assignedTo"].nil?
        event.set("[soc][object][service_source]", d["serviceSource"]) unless d["serviceSource"].nil?
        event.set("[soc][object][incident_id]", d["incidentId"] || (event.get("[soc][dataset]") == "incident" ? d["id"] : nil))
        url = d["incidentWebUrl"] || d["alertWebUrl"]
        event.set("[soc][object][url]", url) unless url.nil?
        event.set("[soc][object][created]", d["createdDateTime"]) unless d["createdDateTime"].nil?
        sev = d["severity"]
        event.set("[event][severity_name]", sev) unless sev.nil?
        if d["lastUpdateDateTime"]
          event.set("[@metadata][version]", (Time.parse(d["lastUpdateDateTime"]).to_r * 1000).to_i.to_s)
        end
      '
    }
    mutate {
      add_field => {
        "[event][kind]" => "alert"
        "[event][module]" => "defender"
        "[event][dataset]" => "defender.%{[soc][dataset]}"
      }
    }
    if [soc][entity] in ["incident", "alert"] {
      # Estado atual: um documento por id. A versão externa (lastUpdateDateTime)
      # impede que uma atualização antiga sobrescreva uma mais nova.
      mutate { add_field => { "[@metadata][index]" => "soc-%{[soc][dataset]}s" } }
    } else {
      mutate {
        add_field => { "[@metadata][index]" => "soc-%{[soc][dataset]}-history-%{+YYYY.MM}" }
        remove_field => ["[@metadata][version]"]
      }
    }
  } else {
    mutate { add_field => { "[@metadata][index]" => "soc-unknown-%{+YYYY.MM}" } }
  }
}

output {
  if [@metadata][version] {
    elasticsearch {
      id => "es_current_state"
      hosts => ["${SOC_ES_HOSTS}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "${SOC_ES_LOGSTASH_USER}"
      password => "${SOC_ES_LOGSTASH_PASSWORD}"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
      action => "index"
      index => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
      version => "%{[@metadata][version]}"
      version_type => "external_gte"
    }
  } else {
    elasticsearch {
      id => "es_events"
      hosts => ["${SOC_ES_HOSTS}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "${SOC_ES_LOGSTASH_USER}"
      password => "${SOC_ES_LOGSTASH_PASSWORD}"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
      action => "index"
      index => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
    }
  }
}
