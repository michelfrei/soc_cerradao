# PostgreSQL (soc.publication) -> Elasticsearch
#
# Leitura incremental por txid: só transações já encerradas (txid abaixo do
# xmin do snapshot) são lidas, então nenhuma linha confirmada fora de ordem é
# pulada. Não habilite paginação (jdbc_paging_enabled): todas as linhas de uma
# transação precisam vir na mesma consulta. Detalhes em docs/DECISOES.md.

input {
  jdbc {
    id => "soc_publication"
    jdbc_driver_library => "/usr/share/logstash/jdbc/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://${SOC_PG_HOST}:${SOC_PG_PORT}/soc?sslmode=${SOC_PG_SSLMODE}&sslrootcert=${SOC_PG_SSLROOTCERT:/usr/share/logstash/pg-ca/ca.crt}&ApplicationName=soc-logstash"
    jdbc_user => "${SOC_LOGSTASH_DB_USER}"
    jdbc_password => "${SOC_LOGSTASH_DB_PASSWORD}"
    jdbc_fetch_size => 1000
    schedule => "*/30 * * * * *"
    statement_filepath => "/usr/share/logstash/sql/publication.sql"
    use_column_value => true
    tracking_column => "txid"
    tracking_column_type => "numeric"
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/soc_publication_last_run.yml"
  }
  # Snapshots operacionais não usam nem alteram o cursor xid8 da publicação.
  jdbc {
    id => "soc_telemetry"
    jdbc_driver_library => "/usr/share/logstash/jdbc/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://${SOC_PG_HOST}:${SOC_PG_PORT}/soc?sslmode=${SOC_PG_SSLMODE}&sslrootcert=${SOC_PG_SSLROOTCERT:/usr/share/logstash/pg-ca/ca.crt}&ApplicationName=soc-telemetry"
    jdbc_user => "${SOC_LOGSTASH_DB_USER}"
    jdbc_password => "${SOC_LOGSTASH_DB_PASSWORD}"
    schedule => "* * * * *"
    statement_filepath => "/usr/share/logstash/sql/telemetry.sql"
    record_last_run => false
  }
  http_poller {
    id => "soc_es_capacity"
    urls => {
      capacity => {
        method => get
        url => "${SOC_ES_HOSTS}/_nodes/_local/stats/jvm,process,fs,indices?filter_path=nodes.*.name,nodes.*.jvm.mem,nodes.*.process.cpu.percent,nodes.*.fs.total,nodes.*.indices.store.size_in_bytes"
        user => "${SOC_ES_LOGSTASH_USER}"
        password => "${SOC_ES_LOGSTASH_PASSWORD}"
        headers => { Accept => "application/json" }
      }
    }
    schedule => { every => "60s" }
    request_timeout => 20
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    ssl_verification_mode => "full"
    codec => json { target => "[es_stats]" }
    metadata_target => "[@metadata][http_poller]"
    add_field => { "[@metadata][metric_input]" => "elasticsearch" }
  }

}

filter {
  if [@metadata][metric_input] != "elasticsearch" {
    json {
      source => "payload_json"
      target => "defender"
      remove_field => ["payload_json"]
    }
    date { match => ["occurred_at_iso", "ISO8601"] timezone => "UTC" }
    mutate {
      add_field => {
        "[soc][entity]" => "%{entity}"
        "[soc][dataset]" => "%{dataset}"
        "[@metadata][doc_id]" => "%{doc_id}"
      }
      copy => { "id" => "[soc][publication_id]" "txid" => "[soc][txid]" }
    }
    mutate { remove_field => ["entity", "dataset", "doc_id", "id", "txid", "occurred_at_iso", "@version"] }
  }
  ruby {
    id => "soc_normalize"
    path => "/usr/share/logstash/pipeline/normalize.rb"
    script_params => { "identities_path" => "/usr/share/logstash/config/identities.json" }
  }
}

output {
  if [@metadata][version] {
    elasticsearch {
      id => "es_current_state"
      hosts => ["${SOC_ES_HOSTS}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "${SOC_ES_LOGSTASH_USER}"
      password => "${SOC_ES_LOGSTASH_PASSWORD}"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
      action => "index"
      index => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
      version => "%{[@metadata][version]}"
      version_type => "external_gte"
    }
  } else {
    elasticsearch {
      id => "es_events"
      hosts => ["${SOC_ES_HOSTS}"]
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
      user => "${SOC_ES_LOGSTASH_USER}"
      password => "${SOC_ES_LOGSTASH_PASSWORD}"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
      action => "index"
      index => "%{[@metadata][index]}"
      document_id => "%{[@metadata][doc_id]}"
    }
  }
}
