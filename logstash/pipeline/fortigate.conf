# FortiAnalyzer → syslog-relay (TLS, RFC 6587) → esta pipeline → Elasticsearch (fw-logs-fortigate)
#
# O relay entrega uma mensagem por linha pela rede interna do Compose; esta porta não
# é publicada na VM. Fila persistente própria (pipelines.yml): se o Elasticsearch parar,
# os logs esperam em disco e, com a fila cheia, o TCP segura o relay e o FortiAnalyzer.

input {
  tcp {
    id => "fortigate_syslog"
    host => "0.0.0.0"
    port => 5514
    codec => line { charset => "UTF-8" }
  }
}

filter {
  ruby {
    id => "fortigate_normalize"
    path => "/usr/share/logstash/pipeline/fortigate.rb"
  }
}

output {
  elasticsearch {
    id => "es_fortigate"
    hosts => ["${SOC_ES_HOSTS}"]
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca/ca.crt"]
    user => "${SOC_ES_LOGSTASH_USER}"
    password => "${SOC_ES_LOGSTASH_PASSWORD}"
    # Data stream criado pelo template fw-logs-fortigate; a ação create é a exigida em data streams.
    data_stream => "false"
    manage_template => false
    ilm_enabled => false
    action => "create"
    index => "fw-logs-fortigate"
  }
}
